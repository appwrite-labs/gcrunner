name: Build GCE Runner Images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'cache-server/**'
      - '.github/workflows/build-images.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'cache-server/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

env:
  FAMILY: ubuntu2404-x64
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ZONE: europe-west3-c

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cache-server/go.mod

      - name: Build cache-server
        working-directory: cache-server
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o cache-server .

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3

      - name: Init Packer
        working-directory: images
        run: packer init .

      - name: Validate Packer
        working-directory: images
        run: packer validate -var-file="${FAMILY}.pkrvars.hcl" -var "project_id=${PROJECT_ID}" -var "zone=${ZONE}" .

      - name: Authenticate to GCP
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image
        if: github.event_name != 'pull_request'
        working-directory: images
        run: |
          packer build -color=false \
            -var-file="${FAMILY}.pkrvars.hcl" \
            -var "project_id=${PROJECT_ID}" \
            -var "zone=${ZONE}" \
            -var "git_sha=${GITHUB_SHA::7}" \
            -var "git_ref=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" \
            -var "image_description=Appwrite runner image from appwrite-labs/gcrunner@${GITHUB_SHA::7}" \
            .

      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          image=$(gcloud compute images list --project="${PROJECT_ID}" \
            --filter="family=gcrunner-${FAMILY}" --sort-by="~creationTimestamp" --limit=1 --format="value(name)")
          vm="smoke-${FAMILY}-${GITHUB_RUN_ID}"
          cat > startup.sh <<'EOF'
          #!/bin/bash
          {
            case "$(uname -r)" in 6.8.*) echo "PASS: kernel $(uname -r)";; *) echo "FAIL: kernel $(uname -r)";; esac
            id -nG runner | grep -qw docker && echo "PASS: runner in docker group" || echo "FAIL: runner not in docker group"
            test -f /home/runner/run.sh && echo "PASS: runner agent" || echo "FAIL: runner agent"
            test -x /usr/local/bin/cache-server && echo "PASS: cache-server" || echo "FAIL: cache-server"
            docker --version && echo "PASS: docker" || echo "FAIL: docker"
            git --version && echo "PASS: git" || echo "FAIL: git"
            gh --version | head -1 && echo "PASS: gh" || echo "FAIL: gh"
            gcloud --version | head -1 && echo "PASS: gcloud" || echo "FAIL: gcloud"
            echo "SMOKE DONE"
          } > /dev/ttyS0 2>&1
          EOF
          gcloud compute instances create "${vm}" --project="${PROJECT_ID}" --zone="${ZONE}" \
            --machine-type=e2-small --image="${image}" --image-project="${PROJECT_ID}" \
            --provisioning-model=SPOT --metadata-from-file=startup-script=startup.sh --quiet
          for _ in $(seq 1 30); do
            sleep 10
            output=$(gcloud compute instances get-serial-port-output "${vm}" --project="${PROJECT_ID}" --zone="${ZONE}" 2>/dev/null || true)
            if grep -q "SMOKE DONE" <<<"${output}"; then break; fi
          done
          gcloud compute instances delete "${vm}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet
          grep -E "^(PASS|FAIL):" <<<"${output}"
          if ! grep -q "SMOKE DONE" <<<"${output}" || grep -q "^FAIL:" <<<"${output}"; then
            echo "::error::smoke test failed for ${image}"
            exit 1
          fi
          echo "image=${image}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Delete images older than the newest three
        if: github.event_name != 'pull_request'
        run: |
          gcloud compute images list --project="${PROJECT_ID}" \
            --filter="family=gcrunner-${FAMILY}" --sort-by="~creationTimestamp" --format="value(name)" \
            | tail -n +4 \
            | xargs -r -n1 gcloud compute images delete --project="${PROJECT_ID}" --quiet
