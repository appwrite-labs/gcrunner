name: Deploy Terraform

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to deploy, e.g. v0.2.0-appwrite.19'
        required: true

concurrency:
  group: deploy-terraform
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check version
        working-directory: .
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$VERSION is not a release tag"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.VERSION }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Write variables
        env:
          TERRAFORM_VARIABLES: ${{ vars.TERRAFORM_VARIABLES }}
          TELEMETRY_HEADERS_SECRET: ${{ vars.TELEMETRY_HEADERS_SECRET }}
        run: |
          umask 077
          printf '%s\n' "$TERRAFORM_VARIABLES" > "$RUNNER_TEMP/deploy.tfvars"
          echo "TF_VAR_gcrunner_version=$VERSION" >> "$GITHUB_ENV"
          if [ -n "$TELEMETRY_HEADERS_SECRET" ]; then
            headers=$(gcloud secrets versions access latest --secret "$TELEMETRY_HEADERS_SECRET")
            echo "::add-mask::$headers"
            echo "TF_VAR_telemetry_headers=$headers" >> "$GITHUB_ENV"
          fi

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"

      - name: Terraform Plan
        run: terraform plan -input=false -var-file="$RUNNER_TEMP/deploy.tfvars" -out="$RUNNER_TEMP/tfplan"

      - name: Terraform Apply
        run: terraform apply -input=false "$RUNNER_TEMP/tfplan"
